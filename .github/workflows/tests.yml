name: Module 5 - Select Menu

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_INDEX_URL: https://pypi.org/simple/
  PYTHONUNBUFFERED: '1'

jobs:
  tests:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, api, ui]
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        if: matrix.suite == 'ui'
        run: python -m playwright install --with-deps chromium
      - name: Run Unit tests with coverage
        if: matrix.suite == 'unit'
        run: python -m pytest tests/unit -v --tb=short --color=no --cov=app --cov-branch --cov-report=json:results/coverage.json --cov-report=html:results/htmlcov --junitxml=results/unit.xml --alluredir=allure-results
      - name: Run API tests against DemoQA
        if: matrix.suite == 'api'
        run: python -m pytest tests/api -v --tb=short --color=no --junitxml=results/api.xml --alluredir=allure-results
      - name: Run Select Menu UI tests
        if: matrix.suite == 'ui'
        run: python -m pytest tests/ui -v --tb=short --color=no --junitxml=results/ui.xml --alluredir=allure-results
      - name: Write test summary
        if: always()
        run: python ci/summarize.py
      - name: Save reports even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.suite }}
          path: |
            results/
            allure-results/
          if-no-files-found: warn
          retention-days: 30

  bdd:
    name: BDD scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Behave scenarios
        run: python -m behave features/select_menu.feature --junit --junit-directory results/bdd --no-capture --no-color
      - name: Write BDD summary
        if: always()
        run: python ci/summarize.py
      - name: Save BDD results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-bdd
          path: results/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Allure HTML report
    runs-on: ubuntu-24.04
    needs: [tests, bdd]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Download pytest reports
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          merge-multiple: true
          path: collected
      - name: Generate Allure HTML
        working-directory: collected
        run: |
          test -d allure-results
          curl --fail --location --retry 2 https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.34.1/allure-commandline-2.34.1.zip --output "$RUNNER_TEMP/allure.zip"
          unzip -q "$RUNNER_TEMP/allure.zip" -d "$RUNNER_TEMP/allure-cli"
          bash "$RUNNER_TEMP/allure-cli/allure-2.34.1/bin/allure" generate allure-results --clean -o allure-report
      - name: Save combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: collected/
          if-no-files-found: warn
          retention-days: 30
